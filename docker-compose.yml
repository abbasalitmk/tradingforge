services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TF_MODE=${TF_MODE:-PAPER}
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET:-}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI}
      - UPSTOX_ANALYTICS_TOKEN=${UPSTOX_ANALYTICS_TOKEN:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - UPSTOX_SANDBOX_TOKEN=${UPSTOX_SANDBOX_TOKEN:-}
      - TF_WEBHOOK_SECRET=${TF_WEBHOOK_SECRET}
      - TF_ENGINE_URL=http://engine:4000
      - TF_ENGINE_TOKEN=${TF_ENGINE_TOKEN}
      - TF_DASHBOARD_USER=${TF_DASHBOARD_USER:-admin}
      - TF_DASHBOARD_PASSWORD=${TF_DASHBOARD_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - GEMINI_PROJECT_ID=${GEMINI_PROJECT_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GROK_MODEL=${GROK_MODEL:-grok-2-latest}
      - GROK_BASE_URL=${GROK_BASE_URL:-https://api.x.ai/v1}
    ports:
      - "3000:3000"
    depends_on:
      - engine
    networks:
      - tf-network

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TF_MODE=${TF_MODE:-PAPER}
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI}
      - UPSTOX_ANALYTICS_TOKEN=${UPSTOX_ANALYTICS_TOKEN:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - UPSTOX_SANDBOX_TOKEN=${UPSTOX_SANDBOX_TOKEN:-}
      - TF_WEBHOOK_SECRET=${TF_WEBHOOK_SECRET}
      - TF_ENGINE_TOKEN=${TF_ENGINE_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - GEMINI_PROJECT_ID=${GEMINI_PROJECT_ID:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - GROK_MODEL=${GROK_MODEL:-grok-2-latest}
      - GROK_BASE_URL=${GROK_BASE_URL:-https://api.x.ai/v1}
      # The position journal lives here; the engine migrates it at boot and will
      # not start without it. Never the host's DATABASE_URL: inside this
      # container, localhost is the container itself.
      - DATABASE_URL=postgresql://tradeforger:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tradeforger
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - engine-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tf-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tradeforger
      - POSTGRES_USER=tradeforger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port: only the engine, on the internal network, reaches it.
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforger -d tradeforger"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tf-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HOSTINGER_DOMAIN=${HOSTINGER_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      - tf-network

networks:
  tf-network:
    driver: bridge

volumes:
  engine-data:
  pg-data:
  caddy-data:
  caddy-config:
